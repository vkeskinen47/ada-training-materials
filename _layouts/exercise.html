---
layout: default
---
<style>
  .markdown-body > h1:first-child {
    display: none;
  }
  .exercise-cover {
    margin: 2rem auto 3rem;
    max-width: 920px;
    text-align: center;
  }
  .exercise-cover__logo {
    display: block;
    width: 400px;
    max-width: 100%;
    height: auto;
    margin: 0 auto 0.5rem;
  }
  .exercise-cover__label {
    margin: 0 0 2.1rem;
    color: #24292f;
    font-size: 1.25rem;
    font-weight: 600;
  }
  .markdown-body hr.exercise-cover__rule {
    width: 80%;
    max-width: 600px;
    margin: 0 auto 2rem;
    height: 0;
    padding: 0;
    border: 0;
    border-top: 2px solid #111;
    background: transparent;
  }
  .exercise-cover__module {
    margin: 0 0 1.5rem;
    color: #24292f;
    font-size: 3rem;
    font-weight: 400;
  }
  .markdown-body h1.exercise-cover__title {
    margin: 0 0 1.4rem;
    padding: 0;
    border: 0;
    color: #24292f;
    font-size: 1.8rem;
    font-weight: 700;
  }
  .exercise-cover__duration {
    margin: 0 0 1rem;
    color: #24292f;
    font-size: 1.1rem;
  }
  .exercise-cover__summary {
    max-width: 900px;
    margin: 0 auto;
    font-size: 1.2rem;
  }
  .exercise-content .ui-action {
    color: #1683c3;
    font-weight: 700;
  }
  .exercise-content table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.25rem 0;
  }
  .exercise-content th,
  .exercise-content td {
    border: 1px solid #d1d5da;
    padding: 0.65rem 0.8rem;
    text-align: left;
    vertical-align: top;
  }
  .exercise-content td:first-child {
    font-weight: 700;
  }
  .exercise-content th {
    color: #24292f;
    font-weight: 700;
  }
  .exercise-content blockquote.exercise-note {
    position: relative;
    margin: 1.5rem 0;
    padding: 0.85rem 1rem 0.85rem 2.15rem;
    border: 2px solid #e31875;
    border-left: 2px solid #e31875;
    background: #fff;
    color: #24292f;
  }
  .exercise-content blockquote.exercise-note::before {
    position: absolute;
    top: 0.72rem;
    left: 0.75rem;
    color: #1683c3;
    content: "i";
    font-size: 1.15rem;
    font-weight: 700;
  }
  .exercise-content blockquote.exercise-note p:last-child {
    margin-bottom: 0;
  }
  @media (max-width: 600px) {
    .exercise-cover {
      margin: 1rem auto 1.75rem;
    }
    .exercise-cover__logo {
      width: 320px;
    }
    .exercise-cover__module {
      font-size: 2rem;
    }
    .markdown-body h1.exercise-cover__title {
      font-size: 1.4rem;
    }
    .exercise-cover__summary {
      font-size: 1rem;
    }
    .markdown-body hr.exercise-cover__rule {
      width: 82%;
      margin: 1.5rem auto 1.75rem;
    }
  }
</style>
<header class="exercise-cover">
  <img class="exercise-cover__logo" src="{{ '/assets/images/ADE-logo-black.png' | relative_url }}" alt="Agile Data Engine">
  <p class="exercise-cover__label">for Data Engineers</p>
  <hr class="exercise-cover__rule">
  <p class="exercise-cover__module">{{ page.module_label }}</p>
  <h1 class="exercise-cover__title">{{ page.title }}</h1>
  <p class="exercise-cover__duration"><strong>Estimated duration: {{ page.duration }}</strong></p>
  <p class="exercise-cover__summary">{{ page.summary }}</p>
</header>
<main class="exercise-content">
  {{ content }}
</main>
